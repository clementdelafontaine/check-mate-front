name: checkmate

networks:
  checkmate:
    driver: bridge
    name: checkmate-net

# CasaOS-style compose, same pattern as npmplus.
# Data under /DATA/AppData/checkmate (covered by CasaOS backups).

x-casaos:
  author: self
  category: self
  hostname: ""
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/checkmate.png
  index: /
  is_uncontrolled: false
  port_map: "8181"
  scheme: http
  store_app_id: checkmate
  title:
    custom: ""
    en_us: CheckMate

services:
  postgres:
    container_name: checkmate-postgres
    image: docker.io/postgres:17-alpine
    restart: unless-stopped
    cpu_shares: 90
    privileged: false
    networks:
      - checkmate
    environment:
      - POSTGRES_USER=checkmate
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-checkmate}
      - POSTGRES_DB=checkmate
      - TZ=Europe/Paris
    volumes:
      - type: bind
        source: /DATA/AppData/checkmate/postgres
        target: /var/lib/postgresql/data
    ports:
      - host_ip: 127.0.0.1
        target: 5432
        published: "5432"
        protocol: tcp
    devices: []
    cap_add: []
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U checkmate']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: checkmate-api
    image: ghcr.io/clementdelafontaine/checkmate-api:latest
    restart: unless-stopped
    cpu_shares: 90
    privileged: false
    networks:
      - checkmate
    environment:
      - DATABASE_URL=postgres://checkmate:${POSTGRES_PASSWORD:-checkmate}@postgres:5432/checkmate
      - PORT=3000
      - TZ=Europe/Paris
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - COOKIE_SECURE=true
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    ports:
      - host_ip: 127.0.0.1
        target: 3000
        published: "3100"
        protocol: tcp
    devices: []
    cap_add: []
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  front:
    container_name: checkmate-front
    image: ghcr.io/clementdelafontaine/checkmate-front:latest
    restart: unless-stopped
    cpu_shares: 90
    privileged: false
    networks:
      - checkmate
    depends_on:
      api:
        condition: service_healthy
        required: true
    ports:
      - host_ip: 127.0.0.1
        target: 80
        published: "8181"
        protocol: tcp
    devices: []
    cap_add: []

name: checkmate

# Deployed as a CasaOS custom app.
# Data lives under /DATA/AppData/checkmate (CasaOS backup-friendly bind mounts).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkmate}
      POSTGRES_DB: checkmate
    volumes:
      - ${CHECKMATE_DATA_DIR:-/DATA/AppData/checkmate}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U checkmate']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://checkmate:${POSTGRES_PASSWORD:-checkmate}@postgres:5432/checkmate
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - internal

  front:
    build:
      context: ./front
      args:
        VITE_USE_API: 'true'
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - proxy

networks:
  default:
    name: checkmate_internal
  proxy:
    # Network of your Nginx Proxy Manager instance (docker network ls).
    name: ${NPM_NETWORK:-nginx-proxy-manager_default}
    external: true
